<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>М-Чат</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Плейсхолдеры для боковых узоров -->
    <img src="placeholder-pattern.svg" class="pattern left-pattern" alt="Red pattern">
    <img src="placeholder-pattern.svg" class="pattern right-pattern" alt="Red pattern">

    <div class="chat-container">
        <header class="chat-header">
            <!-- Плейсхолдер для маскота -->
            <img src="placeholder-mascot.png" alt="Mascot" class="mascot">
            <div class="header-title">
                Chat name
            </div>
            <div class="logos">
                <!-- Плейсхолдеры для логотипов -->
                <img src="placeholder-logo1.png" alt="Logo 1" class="logo">
                <img src="placeholder-logo2.png" alt="Logo 2" class="logo">
            </div>
        </header>

        <div id="chat-window" class="chat-window">
            <!-- Начальный блок с популярными вопросами -->
            <div class="message bot-message" id="faq-section">
                <div class="faq-header">Популярные вопросы</div>
                <div class="faq-list">
                    <button class="faq-button">Специальности/профессии</button>
                    <button class="faq-button">Льготы для обучающихся</button>
                    <button class="faq-button">Педагогический состав</button>
                    <button class="faq-button">Учебный план</button>
                    <button class="faq-button">Когда проходят сессии</button>
                    <button class="faq-button">Как пройти к декану</button>
                    <button class="faq-button">Режим работы декана</button>
                    <button class="faq-button">Расписание на сегодня</button>
                    <button class="faq-button">Как добраться до метро</button>
                </div>
            </div>
        </div>

        <footer class="chat-input-area">
            <button id="voice-btn" class="mic-button">
                <!-- Иконка микрофона -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
            <form id="message-form" class="message-form">
                <input type="text" id="message-input" placeholder="Спросите что-нибудь..." autocomplete="off">
                <button type="submit" class="send-button">
                    <!-- Иконка отправки -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
